name: Update introductions data

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: introductions-data
  cancel-in-progress: false

jobs:
  update-data:
    if: >-
      startsWith(github.event.issue.title, '[Introduction submission]') &&
      (github.event_name != 'issue_comment' || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch and validate introduction
        id: update
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/update_introductions.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- introductions.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add introductions.json
          git commit -m "Update introduction for ${{ steps.update.outputs.username }}"
          git push
      - name: Close submission issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --comment "Introduction data validated and added to [introductions.json](https://raw.githubusercontent.com/$REPOSITORY/main/introductions.json)."
      - name: Comment on failed submission
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          FEEDBACK: ${{ steps.update.outputs.feedback }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "The submission could not be processed:

          $FEEDBACK

          Fix the item above, then edit this issue or leave a new comment to retry processing."
