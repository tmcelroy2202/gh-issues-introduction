name: Update introductions data

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: introductions-data
  cancel-in-progress: false

jobs:
  update-data:
    if: >-
      startsWith(github.event.issue.title, '[Introduction submission]') &&
      (github.event_name != 'issue_comment' || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch and validate introduction
        id: update
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/update_introductions.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- introductions.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add introductions.json
          git commit -m "Update introduction for ${{ steps.update.outputs.username }}"
          git push
      - name: Comment with validation and field audit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          REPORT: ${{ steps.update.outputs.report }}
          USERNAME: ${{ steps.update.outputs.username }}
          OPERATION: ${{ steps.update.outputs.operation }}
        run: |
          body=$(printf '## Introduction submission %s\n\n%s\n\nRecord **%s** for `%s`. The class data file is [introductions.json](https://raw.githubusercontent.com/%s/main/introductions.json).' "$OPERATION" "$REPORT" "$OPERATION" "$USERNAME" "$REPOSITORY")
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$body"
      - name: Close successfully processed issue
        if: success() && github.event.issue.state == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY"
      - name: Comment on failed submission
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          FEEDBACK: ${{ steps.update.outputs.feedback }}
          REPORT: ${{ steps.update.outputs.report }}
        run: |
          if [ -n "$FEEDBACK" ]; then
            body=$(printf '## Introduction submission was not accepted\n\n%s\n\nFix the reported issue, then edit the issue or leave a new comment to retry.' "$FEEDBACK")
          else
            body=$(printf '## Introduction submission processing failed\n\n%s\n\nThe JSON passed inspection, but a later processing step failed. See this run’s logs and retry by editing the issue or leaving a new comment.' "$REPORT")
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$body"
